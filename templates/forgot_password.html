<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Rent Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>

<body class="auth-body">
    <div class="auth-container">
        <div class="logo" style="display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 1.5rem;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Rent Hub Logo" style="height: 48px; width: auto; object-fit: contain;" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x50?text=Rent+Hub';">
            <span style="font-weight: 800; font-size: 1.75rem; color: white; letter-spacing: -0.025em;">Rent Hub</span>
        </div>

        <h2>Forgot Password</h2>
        <p class="subtitle">Enter your registered Gmail ID to receive a password reset link</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <ul class="flash-messages">
            {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="gmail">Registered Gmail ID</label>
                <input type="email" id="gmail" name="gmail" placeholder="Enter your Gmail ID" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('index') }}" class="back-link">← Return to Login</a>
        </div>
    </div>
</body>

</html>
